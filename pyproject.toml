[build-system]
requires = ["setuptools", "wheel", "tree_sitter"]
build-backend = "setuptools.build_meta"

[project]
name = "tree_sitter_rst"
version = "0.0.3"
description = "Binary Python wheels for the tree-sitter RST parser."
readme = "README.rst"
license = { text = "Apache-2.0" }
authors = [{ name = "Matthias Bussonnier", email = "bussonniermatthias@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["tree-sitter-builds"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/carreau/py-tree-sitter-rst"
Repository = "https://github.com/carreau/py-tree-sitter-rst"

[tool.setuptools.packages.find]
where = ["."]
include = ["tree_sitter_rst*"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["pp*", "*-musllinux*"]
test-requires = "pytest"
test-command = "pytest --pyargs tree_sitter_rst"
before-build = [
    "git submodule update --init",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tree_sitter_rst/tests"]
